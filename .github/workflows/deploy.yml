name: Deploy after Build

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [develop]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
         ref: ${{ github.event.workflow_run.head_sha }}
      - name: Compare SHAs
        run: |
          echo "Event head SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "GitHub/default SHA: ${{ github.sha }}"
          echo "Checked out SHA: $(git rev-parse HEAD)"
